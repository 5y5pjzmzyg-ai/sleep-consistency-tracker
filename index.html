<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111422">
  <meta name="description" content="Track your sleep schedule, first alarm, daily energy and how well you used your day.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Nightline">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <title>Nightline · Sleep Consistency</title>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="shell bar">
      <button type="button" class="brand" data-nav="home"><img src="./icon.svg" alt="" width="37" height="37"><span>Nightline<small>Sleep consistency</small></span></button>
      <nav id="nav" aria-label="Main navigation"></nav>
    </div>
  </header>
  <main class="shell" id="main" tabindex="-1"><p>Opening Nightline…</p></main>

  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Nightline needs JavaScript to open your check-ins.</noscript>
  <script type="module" src="./app.mjs"></script>

</html>
